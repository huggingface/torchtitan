# Minimal FSDP debug config — HF Transformers backend

[job]
dump_folder = "./outputs"
description = "Minimal FSDP debug (HF Transformers backend)"
print_config = true
custom_config_module = "torchtitan.experiments.transformers_modeling_backend.job_config"

[metrics]
log_freq = 1
disable_color_printing = false

[model]
name = "transformers_modeling_backend"
flavor = "debugmodel"
hf_assets_path = "./tests/assets/tokenizer"

[hf_transformers]
model = "meta-llama/Llama-3.2-1B"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 2

[training]
local_batch_size = 2
seq_len = 512
max_norm = 1.0
steps = 10

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "none"

[compile]
enable = false

[debug]
seed = 2026
deterministic = false
