# TorchTitan config — Llama3 8B, FSDP, 3000 steps

[job]
dump_folder = "./outputs"
description = "Llama3 8B (TorchTitan backend, FSDP)"
print_config = true

[metrics]
log_freq = 1
disable_color_printing = false

[model]
name = "llama3"
flavor = "8B"
hf_assets_path = "../../../tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 100

[training]
local_batch_size = 1
seq_len = 2048
max_norm = 1.0
steps = 3000
dataset = "c4_test"
dataset_path = "../../../tests/assets/c4_test"
mixed_precision_param = "float32"
mixed_precision_reduce = "float32"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "none"

[compile]
enable = false

[debug]
seed = 2026
deterministic = true
