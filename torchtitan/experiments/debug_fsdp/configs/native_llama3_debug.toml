# Minimal FSDP debug config — Native TorchTitan Llama 3

[job]
dump_folder = "./outputs"
description = "Minimal FSDP debug (native Llama 3)"
print_config = true

[metrics]
log_freq = 1
disable_color_printing = false

[model]
name = "llama3"
flavor = "debugmodel"
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 2

[training]
local_batch_size = 2
seq_len = 512
max_norm = 1.0
steps = 10
dataset = "c4_test"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "none"

[compile]
enable = false

[debug]
seed = 2026
deterministic = false
